server:
  port: ${SERVER_PORT}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: rolls-service
  config:
    import: optional:file:.env[.properties]


  # Redis конфигурация через Lettuce
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 2000ms
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
          time-between-eviction-runs: 30s
          enabled: false
        shutdown-timeout: 100ms
      repositories:
        enabled: false  # Отключаем Spring Data Redis репозитории

app:
  # URL микросервисов
  services:
    auth-service:
      url: ${AUTH_SERVICE_URL}
      service-token: ${AUTH_SERVICE_TOKEN}

  # Настройки сессии
  session:
    ttl-minutes: ${SESSION_TTL}
    max-concurrent-sessions: 5
  # Настройки cookie
  cookie:
#    domain: ${COOKIE_DOMAIN}
    secure: ${COOKIE_SECURE}
    same-site: ${COOKIE_SAME_SITE}
    name: ${COOKIE_NAME}


# ============================================
# LOGGING
# ============================================
logging:
  level:
    com.example.rolls: ${APP_LOG_LEVEL}
    org.springframework.security: ${SECURITY_LOG_LEVEL}
    org.springframework.data.redis: WARN
    io.lettuce.core: WARN
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"